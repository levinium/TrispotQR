name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The point of this job. Core and the view models carry no Windows dependency, and until
  # they ran here that was a claim asserted from a Windows machine rather than evidence.
  # This builds and tests both on all three desktop operating systems, including the
  # SkiaSharp native binaries and the per-platform settings paths, which no Windows run
  # can exercise.
  portable:
    name: Core and view models on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Standard runners only. GitHub's larger runners, including the Apple Silicon
        # macOS ones, are billed even on public repositories.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test Core
        run: dotnet test tests/TrispotQR.Core.Tests/TrispotQR.Core.Tests.csproj -c Release --verbosity normal

      - name: Test view models
        run: dotnet test tests/TrispotQR.ViewModels.Tests/TrispotQR.ViewModels.Tests.csproj -c Release --verbosity normal

  # The WPF app and its UI tests. Windows only, by nature, until the Avalonia port lands.
  windows:
    name: App and UI tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the whole solution
        run: dotnet test TrispotQR.slnx -c Release --verbosity normal
